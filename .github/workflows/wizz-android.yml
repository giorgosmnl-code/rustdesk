name: Wizz Android APK
run-name: ${{ inputs.variant }} APK
on:
  workflow_dispatch:
    inputs:
      variant:
        description: App to build
        type: choice
        options:
        - multiview
        - wizz
        default: multiview
env:
  RUST_VERSION: '1.75'
  CARGO_NDK_VERSION: 3.1.2
  ANDROID_FLUTTER_VERSION: 3.24.5
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
  VCPKG_COMMIT_ID: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  VERSION: 1.5.3
  NDK_VERSION: r28c
jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      key: ${{ steps.k.outputs.key }}
      hit: ${{ steps.c.outputs.cache-hit }}
    steps:
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
    - name: Compute Rust cache key
      id: k
      shell: bash
      run: |
        echo "key=wizz-rustlib-aarch64-${{ hashFiles('src/**', 'libs/**', 'Cargo.toml', 'Cargo.lock', 'build.rs', '.github/workflows/bridge.yml', 'flutter/build_android_deps.sh', 'flutter/ndk_arm64.sh', '.github/wizz/wizz_rust.py') }}" >> "$GITHUB_OUTPUT"
    - name: Look up cache
      id: c
      uses: actions/cache/restore@v4
      with:
        path: wizz-cache
        key: ${{ steps.k.outputs.key }}
        lookup-only: true
  generate-bridge:
    needs:
    - check
    if: needs.check.outputs.hit != 'true'
    uses: ./.github/workflows/bridge.yml
  build:
    needs:
    - check
    - generate-bridge
    if: ${{ !cancelled() && needs.check.result == 'success' && (needs.generate-bridge.result == 'success' || needs.generate-bridge.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
      with:
        tool-cache: false
        android: false
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: false
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
    - name: Install dependencies
      run: |
        APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60"
        sudo apt-get $APT_OPTS update
        sudo apt-get $APT_OPTS install -y \
             clang \
             cmake \
             curl \
             gcc-multilib \
             git \
             g++ \
             g++-multilib \
             libayatana-appindicator3-dev \
             libasound2-dev \
             libc6-dev \
             libclang-dev \
             libunwind-dev \
             libgstreamer1.0-dev \
             libgstreamer-plugins-base1.0-dev \
             libgtk-3-dev \
             libpulse-dev \
             libva-dev \
             libxcb-randr0-dev \
             libxcb-shape0-dev \
             libxcb-xfixes0-dev \
             libxdo-dev \
             libxfixes-dev \
             llvm-dev \
             nasm \
             ninja-build \
             pkg-config \
             tree \
             wget
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
    - name: Apply Wizz changes (zoom limit, multi-session, app id)
      shell: bash
      env:
        WIZZ_VARIANT: ${{ inputs.variant }}
      run: |
        if [ "$WIZZ_VARIANT" = "wizz" ]; then
          APPID=com.wizz.rustdesk; LABEL="RustDesk Wizz"; export WIZZ_MULTI=0
        else
          APPID=com.wizz.rustdesk.multiview; LABEL="RustDesk Multiview"; export WIZZ_MULTI=1
        fi
        sed -i "s/applicationId \"com.carriez.flutter_hbb\"/applicationId \"$APPID\"/" flutter/android/app/build.gradle
        sed -i "s/android:label=\"RustDesk\"\$/android:label=\"$LABEL\"/" flutter/android/app/src/main/AndroidManifest.xml
        python3 .github/wizz/wizz_apply.py
        python3 .github/wizz/wizz_rust.py
        grep -n "applicationId \"$APPID\"" flutter/android/app/build.gradle
        grep -n "android:label=\"$LABEL\"" flutter/android/app/src/main/AndroidManifest.xml
        git --no-pager diff --stat
    - name: Restore cached Rust library + bridge (skips the slow part)
      id: wizzcache
      uses: actions/cache/restore@v4
      with:
        path: wizz-cache
        key: ${{ needs.check.outputs.key }}
    - name: Install flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}
    - name: Patch flutter
      run: |
        cd $(dirname $(dirname $(which flutter)))
        if [[ "3.24.5" == ${{env.ANDROID_FLUTTER_VERSION}} ]]; then
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
        fi
    - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
      id: setup-ndk
      with:
        ndk-version: ${{ env.NDK_VERSION }}
        add-to-path: true
    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgDirectory: /opt/artifacts/vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false
      if: steps.wizzcache.outputs.cache-hit != 'true'
    - name: Install vcpkg dependencies
      run: |
        ./flutter/build_android_deps.sh arm64-v8a
      shell: bash
      if: steps.wizzcache.outputs.cache-hit != 'true'
    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: bridge-artifact
        path: ./
      if: steps.wizzcache.outputs.cache-hit != 'true'
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ env.RUST_VERSION }}
        components: rustfmt
      if: steps.wizzcache.outputs.cache-hit != 'true'
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        prefix-key: rustdesk-lib-cache-android
        key: aarch64-linux-android
      if: steps.wizzcache.outputs.cache-hit != 'true'
    - name: Build rustdesk lib
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        rustup target add aarch64-linux-android
        cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
        ./flutter/ndk_arm64.sh
      if: steps.wizzcache.outputs.cache-hit != 'true'
    - name: Store Rust library + bridge for next builds
      if: steps.wizzcache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p wizz-cache
        cp ./target/aarch64-linux-android/release/liblibrustdesk.so wizz-cache/
        cp ./src/bridge_generated.rs ./src/bridge_generated.io.rs ./flutter/lib/generated_bridge.dart ./flutter/lib/generated_bridge.freezed.dart wizz-cache/
        ls -la wizz-cache
    - name: Save cache
      if: steps.wizzcache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: wizz-cache
        key: ${{ needs.check.outputs.key }}
    - name: Use cached Rust library + bridge
      if: steps.wizzcache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        mkdir -p ./target/aarch64-linux-android/release
        cp wizz-cache/liblibrustdesk.so ./target/aarch64-linux-android/release/
        cp wizz-cache/bridge_generated.rs wizz-cache/bridge_generated.io.rs ./src/
        cp wizz-cache/generated_bridge.dart wizz-cache/generated_bridge.freezed.dart ./flutter/lib/
        echo "Reusing cached Rust library and bridge"
    - name: Build rustdesk
      shell: bash
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        WIZZ_KEYSTORE_B64: ${{ secrets.WIZZ_KEYSTORE_B64 }}
        WIZZ_KEYSTORE_PASSWORD: ${{ secrets.WIZZ_KEYSTORE_PASSWORD }}
        WIZZ_KEY_ALIAS: ${{ secrets.WIZZ_KEY_ALIAS }}
      run: |
        # use the Java 17 that GitHub's runner already has (no 120 MB apt download)
        if [ -z "$JAVA_HOME_17_X64" ] || [ ! -x "$JAVA_HOME_17_X64/bin/java" ]; then
          echo "::error::Preinstalled Java 17 not found (JAVA_HOME_17_X64 is empty)"
          exit 1
        fi
        export JAVA_HOME="$JAVA_HOME_17_X64"
        export PATH="$JAVA_HOME/bin:$PATH"
        java -version
        sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
        if [ -n "$WIZZ_KEYSTORE_B64" ]; then
          echo "$WIZZ_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/wizz.jks"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' "$WIZZ_KEYSTORE_PASSWORD" "$WIZZ_KEYSTORE_PASSWORD" "$WIZZ_KEY_ALIAS" "$RUNNER_TEMP/wizz.jks" > ./flutter/android/key.properties
          echo "Signing with the Wizz release key"
        else
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          echo "::warning::Wizz signing secrets not set - using a random debug key"
        fi
        mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
        cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/
        cp ./target/aarch64-linux-android/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
        cd flutter
        flutter build apk --release --target-platform android-arm64 --split-per-abi
        mkdir -p ../out && cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../out/rustdesk-${{ inputs.variant }}-${{ env.VERSION }}-arm64.apk
    - name: Upload APK
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: rustdesk-${{ inputs.variant }}-apk
        path: out/*.apk
