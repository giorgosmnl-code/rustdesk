name: Wizz Android APK
on:
  workflow_dispatch:
env:
  RUST_VERSION: '1.75'
  CARGO_NDK_VERSION: 3.1.2
  ANDROID_FLUTTER_VERSION: 3.24.5
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
  VCPKG_COMMIT_ID: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  VERSION: 1.5.3
  NDK_VERSION: r28c
jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml
  build:
    needs:
    - generate-bridge
    runs-on: ubuntu-24.04
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
      with:
        tool-cache: false
        android: false
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: false
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
             clang \
             cmake \
             curl \
             gcc-multilib \
             git \
             g++ \
             g++-multilib \
             libayatana-appindicator3-dev \
             libasound2-dev \
             libc6-dev \
             libclang-dev \
             libunwind-dev \
             libgstreamer1.0-dev \
             libgstreamer-plugins-base1.0-dev \
             libgtk-3-dev \
             libpulse-dev \
             libva-dev \
             libxcb-randr0-dev \
             libxcb-shape0-dev \
             libxcb-xfixes0-dev \
             libxdo-dev \
             libxfixes-dev \
             llvm-dev \
             nasm \
             ninja-build \
             openjdk-17-jdk-headless \
             pkg-config \
             tree \
             wget
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
    - name: Apply Wizz changes (zoom limit + app id)
      shell: bash
      run: |
        sed -i 's/applicationId "com.carriez.flutter_hbb"/applicationId "com.wizz.rustdesk"/' flutter/android/app/build.gradle
        sed -i 's/android:label="RustDesk"$/android:label="RustDesk Wizz"/' flutter/android/app/src/main/AndroidManifest.xml
        python3 - <<'PYEOF'
        p = 'flutter/lib/models/model.dart'
        s = open(p).read()
        a = 'return min(xscale, yscale) / 1.5;'
        assert s.count(a) == 1
        s = s.replace(a, 'return min(xscale, yscale);')
        b = '    _y = focalPoint.dy - adjust - (focalPoint.dy - _y - adjust) / s * _scale;\n'
        assert s.count(b) == 1
        c = ('    final vs = getSize();\n'
             '    final dw = getDisplayWidth() * _scale;\n'
             '    final dh = getDisplayHeight() * _scale;\n'
             '    if (dw <= vs.width) _x = (vs.width - dw) / 2;\n'
             '    if (dh <= vs.height) _y = (vs.height - dh) / 2;\n')
        s = s.replace(b, b + c)
        open(p, 'w').write(s)
        PYEOF
        grep -n 'com.wizz.rustdesk' flutter/android/app/build.gradle
        grep -n 'RustDesk Wizz' flutter/android/app/src/main/AndroidManifest.xml
        git --no-pager diff
    - name: Install flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}
    - name: Patch flutter
      run: |
        cd $(dirname $(dirname $(which flutter)))
        if [[ "3.24.5" == ${{env.ANDROID_FLUTTER_VERSION}} ]]; then
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
        fi
    - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
      id: setup-ndk
      with:
        ndk-version: ${{ env.NDK_VERSION }}
        add-to-path: true
    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgDirectory: /opt/artifacts/vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false
    - name: Install vcpkg dependencies
      run: |
        ./flutter/build_android_deps.sh arm64-v8a
      shell: bash
    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: bridge-artifact
        path: ./
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ env.RUST_VERSION }}
        components: rustfmt
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        prefix-key: rustdesk-lib-cache-android
        key: aarch64-linux-android
    - name: Build rustdesk lib
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        rustup target add aarch64-linux-android
        cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
        ./flutter/ndk_arm64.sh
    - name: Build rustdesk
      shell: bash
      env:
        JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
        sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
        sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
        mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
        cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/
        cp ./target/aarch64-linux-android/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
        cd flutter
        flutter build apk --release --target-platform android-arm64 --split-per-abi
        mkdir -p ../out && cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../out/rustdesk-wizz-${{ env.VERSION }}-arm64.apk
    - name: Upload APK
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: rustdesk-wizz-apk
        path: out/*.apk
